<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoshikawa ESM • Download</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a1635, #0f0d1f);
      padding: 20px;
    }
    .player-card {
      background: rgba(30, 27, 54, 0.85);
      border-radius: 24px;
      padding: 0;
      max-width: 420px;
      width: 100%;
      color: #fff;
      box-shadow: 0 10px 50px rgba(139, 92, 246, 0.2);
      overflow: hidden;
      border: 1px solid rgba(139, 92, 246, 0.15);
    }
    .capa {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
    }
    .info {
      padding: 20px 22px 10px;
    }
    .titulo {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f8fafc;
      line-height: 1.4;
    }
    .autor {
      font-size: 14px;
      color: #a78bfa;
      margin-bottom: 16px;
    }
    .barra-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .barra-progresso {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #c084fc);
      border-radius: 3px;
      transition: width 0.1s;
    }
    .tempo {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .botoes {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 24px;
    }
    .btn-controle {
      background: transparent;
      border: none;
      color: #ddd6fe;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-controle:hover { color: #fff; transform: scale(1.1); }
    .btn-play {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }
    .btn-baixar {
      width: 100%;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 24px;
      transition: 0.2s;
    }
    .btn-baixar:hover { transform: scale(1.02); }
    .rodape {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #78716c;
      padding: 0 22px 20px;
    }
    .erro {
      padding: 40px 22px;
      text-align: center;
    }
    .erro h2 { color: #f87171; margin-bottom: 10px; }
    .erro p { color: #a1a1aa; margin-bottom: 20px; }
    .link-voltar {
      color: #a78bfa;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="player-card" id="card">
    <div style="padding: 60px 20px; text-align:center; color:#a78bfa;">
      🔄 Carregando...
    </div>
  </div>

  <script>
    const caminho = window.location.pathname.split('/dl/')[1] || '';
    const card = document.getElementById('card');

    try {
      const decodificado = atob(decodeURIComponent(caminho));
      const dados = JSON.parse(decodificado);

      card.innerHTML = `
        <img src="${dados.capa || 'https://i.imgur.com/ZLwQ9xP.png'}" alt="Capa" class="capa" id="capa">
        <div class="info">
          <h1 class="titulo" id="titulo">${dados.titulo || 'Sem Título'}</h1>
          <p class="autor">@${dados.autor || 'mgzinhomodz'}</p>

          <div class="barra-container" id="barraClicavel">
            <div class="barra-progresso" id="barra"></div>
          </div>

          <div class="tempo">
            <span id="tempoAtual">0:00</span>
            <span id="tempoTotal">0:00</span>
          </div>

          <audio id="audio" src="${dados.url}" preload="metadata" style="display:none;">

          <div class="botoes">
            <button class="btn-controle" id="btn-voltar">⏮</button>
            <button class="btn-controle" id="btn-voltar10">◀◀</button>
            <button class="btn-controle btn-play" id="btn-play">▶</button>
            <button class="btn-controle" id="btn-avancar10">▶▶</button>
            <button class="btn-controle" id="btn-avancar">⏭</button>
          </div>

          <a href="${dados.url}" class="btn-baixar" download>⬇️ Baixar</a>
        </div>

        <div class="rodape">
          <span>𓍯𓂃𓏧♡ Alimentado por Yoshikawa API</span>
          <span>YOSHIKAWA</span>
        </div>
        <div style="text-align:center; font-size:10px; color:#57534e; padding-bottom:15px;">
          YOSHIKAWA SYSTEMS © 2026
        </div>
      `;

      // Controles do player
      const audio = document.getElementById('audio');
      const btnPlay = document.getElementById('btn-play');
      const barra = document.getElementById('barra');
      const tempoAtual = document.getElementById('tempoAtual');
      const tempoTotal = document.getElementById('tempoTotal');
      const barraClicavel = document.getElementById('barraClicavel');

      function formatarTempo(segundos) {
        if (!segundos) return '0:00';
        const m = Math.floor(segundos / 60);
        const s = Math.floor(segundos % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      audio.addEventListener('loadedmetadata', () => {
        tempoTotal.textContent = formatarTempo(audio.duration);
      });

      audio.addEventListener('timeupdate', () => {
        const porcentagem = (audio.currentTime / audio.duration) * 100 || 0;
        barra.style.width = porcentagem + '%';
        tempoAtual.textContent = formatarTempo(audio.currentTime);
      });

      btnPlay.addEventListener('click', () => {
        if (audio.paused) { audio.play(); btnPlay.textContent = '⏸'; }
        else { audio.pause(); btnPlay.textContent = '▶'; }
      });

      document.getElementById('btn-voltar10').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
      document.getElementById('btn-avancar10').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); });
      document.getElementById('btn-voltar').addEventListener('click', () => { audio.currentTime = 0; });
      document.getElementById('btn-avancar').addEventListener('click', () => { audio.currentTime = audio.duration; });

      barraClicavel.addEventListener('click', (e) => {
        const rect = barraClicavel.getBoundingClientRect();
        const porcentagem = (e.clientX - rect.left) / rect.width;
        audio.currentTime = porcentagem * audio.duration;
      });

    } catch (erro) {
      card.innerHTML = `
        <div class="erro">
          <h2>❌ Link Inválido</h2>
          <p>Verifique o endereço ou gere um novo link pelo bot.</p>
          <a href="/yoshikawa/" class="link-voltar">🏠 Voltar ao início</a>
        </div>
      `;
    }
  </script>
</body>
</html>
