<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Spotify - Modelo Exato</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;}
    body {
      width: 480px;
      height: 640px;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* MOLDURA EXATA DO DESENHO */
    .player {
      width: 420px;
      height: 580px;
      background: #535953; /* Cor cinza exata da moldura */
      border-radius: 32px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    /* ÁREA GRANDE DA CAPA NO TOPO */
    .capa-area {
      width: 100%;
      height: 340px;
      border-radius: 16px;
      overflow: hidden;
      background: #121212;
      margin-bottom: 20px;
      position: relative;
    }
    .capa {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* CABEÇALHO COM BORDA TOTALMENTE ARREDONDADA */
    .cabecalho {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      border-radius: 999px; /* Borda redonda total */
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .foto-perfil {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }
    .texto {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nome-musica {
      color: #FFFFFF; /* NOME EM BRANCO */
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .usuario {
      color: #B3B3B3; /* SEU @ EM CINZA */
      font-size: 13px;
      font-weight: 500;
    }
    /* BARRA DE PROGRESSO EXATA */
    .progresso {
      margin-bottom: 12px;
    }
    .barra-tempo {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.4);
      border-radius: 3px;
      position: relative;
      margin-bottom: 6px;
    }
    .ponto-tempo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #FFFFFF;
      border-radius: 50%;
    }
    .tempos {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #FFFFFF;
    }
    /* BOTÕES EXATOS NA ORDEM */
    .controles {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      margin: 20px 0;
    }
    .btn {
      background: none;
      border: none;
      color: #FFFFFF;
      font-size: 32px;
      cursor: default;
    }
    /* BARRA DE VOLUME EXATA */
    .volume {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .volume i {
      color: #FFFFFF;
      font-size: 18px;
    }
    .barra-volume {
      flex: 1;
      height: 5px;
      background: rgba(255,255,255,0.4);
      border-radius: 3px;
      position: relative;
    }
    .ponto-volume {
      position: absolute;
      left: 60%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: #FFFFFF;
      border-radius: 50%;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="player">
    <!-- ÁREA DA CAPA -->
    <div class="capa-area">
      <img id="capaMusica" src="https://i.imgur.com/5b8ZkLg.png" alt="Capa" class="capa">
      <div class="cabecalho">
        <img src="https://yoshikawa-bot.github.io/cache/images/f43a1e86.jpg" alt="Perfil" class="foto-perfil">
        <div class="texto">
          <div class="nome-musica" id="nomeMusica">Nome da Música</div>
          <div class="usuario">@Mgzinho Modz</div>
        </div>
      </div>
    </div>

    <!-- BARRA DE TEMPO COM PONTO NO MEIO -->
    <div class="progresso">
      <div class="barra-tempo">
        <div class="ponto-tempo"></div>
      </div>
      <div class="tempos">
        <span id="tempoAtual">1:26</span>
        <span id="tempoTotal">-3:04</span>
      </div>
    </div>

    <!-- BOTÕES EXATOS -->
    <div class="controles">
      <button class="btn"><i class="fas fa-backward-step"></i></button>
      <button class="btn"><i class="fas fa-pause"></i></button>
      <button class="btn"><i class="fas fa-forward-step"></i></button>
    </div>

    <!-- BARRA DE VOLUME COM PONTO -->
    <div class="volume">
      <i class="fas fa-volume-low"></i>
      <div class="barra-volume">
        <div class="ponto-volume"></div>
      </div>
      <i class="fas fa-volume-high"></i>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    document.getElementById('nomeMusica').textContent = params.get('titulo') || 'Música'
    document.getElementById('capaMusica').src = params.get('capa') || 'https://i.imgur.com/5b8ZkLg.png'
    document.getElementById('tempoAtual').textContent = params.get('atual') || '1:26'
    document.getElementById('tempoTotal').textContent = `-${params.get('restante') || '3:04'}`
  </script>
</body>
  </html>
